<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 對決五子棋 (Gomoku AI vs AI)</title>
  <style>
    :root {
      --bg: #f4ede2;
      --board: #d9b47a;
      --line: #7b4e1f;
      --ink: #1f1f1f;
      --muted: #5f5f5f;
      --panel: #fffdf8;
      --accent: #b85c2d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.5;
    }
    .container {
      max-width: 1080px;
      margin: 0 auto;
      padding: 16px;
      display: grid;
      gap: 16px;
    }
    h1 { margin: 0; font-size: 28px; }
    .desc, .panel {
      background: var(--panel);
      border: 1px solid #e6d9c5;
      border-radius: 10px;
      padding: 12px 14px;
    }
    .desc p { margin: 6px 0; color: var(--muted); }
    .controls {
      display: grid;
      gap: 10px;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      align-items: center;
    }
    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
    button, select {
      border: 1px solid #c8b392;
      border-radius: 8px;
      background: #fff;
      padding: 8px 12px;
      font-size: 14px;
    }
    button.primary { background: #2f6fdb; border-color: #2f6fdb; color: #fff; }
    button.warn { background: #fff7f2; color: var(--accent); }
    .stat { font-size: 14px; color: #3c3c3c; }
    .board-wrap {
      background: var(--panel);
      border: 1px solid #e6d9c5;
      border-radius: 10px;
      padding: 12px;
      display: grid;
      place-items: center;
    }
    canvas {
      width: min(92vw, 680px);
      height: min(92vw, 680px);
      max-width: 680px;
      max-height: 680px;
      background: var(--board);
      border-radius: 8px;
      box-shadow: inset 0 0 0 1px rgba(80, 44, 15, 0.4);
    }
    #messageLog { color: var(--muted); }
  </style>
</head>
<body>
  <div class="container">
    <h1>AI 對決五子棋 (Gomoku AI vs AI)</h1>

    <section class="desc" id="desc">
      <p>這是 AI vs AI 自動對弈版本，使用 15×15 棋盤。</p>
      <p>每局開始都會隨機抽籤決定哪個 AI 執黑先手、哪個 AI 執白後手。</p>
      <p>AI 採簡單攻防評分策略：先找必勝、再擋必敗，最後以啟發式評分選點。</p>
      <p>可使用「開始 / 重新開始 / 暫停或繼續」與速度選單觀察整局進行。</p>
    </section>

    <section class="panel controls" id="controls">
      <div class="btn-row">
        <button id="startBtn" class="primary" type="button">開始</button>
        <button id="restartBtn" type="button">重新開始</button>
        <button id="pauseBtn" class="warn" type="button" disabled>暫停</button>
      </div>
      <label>速度
        <select id="speedSelect">
          <option value="800">慢 (800ms)</option>
          <option value="400" selected>中 (400ms)</option>
          <option value="150">快 (150ms)</option>
        </select>
      </label>
      <div class="stat" id="drawResult">本局抽籤結果：尚未開始</div>
      <div class="stat" id="turnText">當前回合：-</div>
      <div class="stat" id="moveText">步數：0</div>
      <div class="stat" id="statusText">狀態：READY</div>
    </section>

    <section class="board-wrap">
      <canvas id="board" width="700" height="700" aria-label="15x15 五子棋棋盤"></canvas>
    </section>

    <section class="panel" id="messageLog">最近一步：-</section>
  </div>

  <script>
    const BOARD_SIZE = 15;
    const EMPTY = 0;
    const BLACK = 1;
    const WHITE = 2;
    const STATUS = {
      READY: "READY",
      RUNNING: "RUNNING",
      PAUSED: "PAUSED",
      ENDED: "ENDED"
    };

    const canvas = document.getElementById("board");
    const ctx = canvas.getContext("2d");
    const startBtn = document.getElementById("startBtn");
    const restartBtn = document.getElementById("restartBtn");
    const pauseBtn = document.getElementById("pauseBtn");
    const speedSelect = document.getElementById("speedSelect");
    const drawResultEl = document.getElementById("drawResult");
    const turnTextEl = document.getElementById("turnText");
    const moveTextEl = document.getElementById("moveText");
    const statusTextEl = document.getElementById("statusText");
    const messageLogEl = document.getElementById("messageLog");

    const Renderer = {
      padding: 32,
      get cellSize() {
        return (canvas.width - this.padding * 2) / (BOARD_SIZE - 1);
      },
      toPixel(row, col) {
        return {
          x: this.padding + col * this.cellSize,
          y: this.padding + row * this.cellSize
        };
      },
      drawBoard(boardState) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = "#7b4e1f";
        ctx.lineWidth = 1;
        for (let i = 0; i < BOARD_SIZE; i += 1) {
          const offset = this.padding + i * this.cellSize;
          ctx.beginPath();
          ctx.moveTo(this.padding, offset);
          ctx.lineTo(canvas.width - this.padding, offset);
          ctx.stroke();

          ctx.beginPath();
          ctx.moveTo(offset, this.padding);
          ctx.lineTo(offset, canvas.height - this.padding);
          ctx.stroke();
        }

        for (let row = 0; row < BOARD_SIZE; row += 1) {
          for (let col = 0; col < BOARD_SIZE; col += 1) {
            if (boardState[row][col] !== EMPTY) this.drawStone(row, col, boardState[row][col]);
          }
        }
      },
      drawStone(row, col, color) {
        const { x, y } = this.toPixel(row, col);
        const radius = this.cellSize * 0.42;
        const gradient = ctx.createRadialGradient(x - radius * 0.3, y - radius * 0.3, radius * 0.2, x, y, radius);
        if (color === BLACK) {
          gradient.addColorStop(0, "#4d4d4d");
          gradient.addColorStop(1, "#0f0f0f");
        } else {
          gradient.addColorStop(0, "#ffffff");
          gradient.addColorStop(1, "#d9d9d9");
        }
        ctx.beginPath();
        ctx.fillStyle = gradient;
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = color === BLACK ? "#000" : "#a7a7a7";
        ctx.stroke();
      },
      highlightLastMove(lastMove) {
        if (!lastMove) return;
        const { x, y } = this.toPixel(lastMove.row, lastMove.col);
        const size = this.cellSize * 0.45;
        ctx.strokeStyle = "#c93f1d";
        ctx.lineWidth = 2;
        ctx.strokeRect(x - size / 2, y - size / 2, size, size);
      }
    };

    const RuleEngine = {
      validateMove(board, row, col) {
        return row >= 0 && row < BOARD_SIZE && col >= 0 && col < BOARD_SIZE && board[row][col] === EMPTY;
      },
      countDirection(board, row, col, color, dr, dc) {
        let count = 0;
        let r = row + dr;
        let c = col + dc;
        while (r >= 0 && r < BOARD_SIZE && c >= 0 && c < BOARD_SIZE && board[r][c] === color) {
          count += 1;
          r += dr;
          c += dc;
        }
        return count;
      },
      checkWin(board, row, col, color) {
        const dirs = [[1, 0], [0, 1], [1, 1], [1, -1]];
        return dirs.some(([dr, dc]) => {
          const total = 1
            + this.countDirection(board, row, col, color, dr, dc)
            + this.countDirection(board, row, col, color, -dr, -dc);
          return total >= 5;
        });
      },
      checkDraw(moveCount) {
        return moveCount >= BOARD_SIZE * BOARD_SIZE;
      }
    };

    const AIEngine = {
      getMove(state, color) {
        if (state.moveCount === 0) return { row: 7, col: 7 };

        const opponent = color === BLACK ? WHITE : BLACK;
        const empties = this.getEmptyCells(state.board);

        for (const cell of empties) {
          state.board[cell.row][cell.col] = color;
          const win = RuleEngine.checkWin(state.board, cell.row, cell.col, color);
          state.board[cell.row][cell.col] = EMPTY;
          if (win) return cell;
        }

        for (const cell of empties) {
          state.board[cell.row][cell.col] = opponent;
          const lose = RuleEngine.checkWin(state.board, cell.row, cell.col, opponent);
          state.board[cell.row][cell.col] = EMPTY;
          if (lose) return cell;
        }

        const candidates = this.getCandidateCells(state.board);
        let bestMove = null;
        let bestScore = -Infinity;

        for (const cell of (candidates.length ? candidates : empties)) {
          const attackScore = this.evaluatePlacement(state.board, cell.row, cell.col, color);
          const defendScore = this.evaluatePlacement(state.board, cell.row, cell.col, opponent);
          const centerBias = 14 - (Math.abs(7 - cell.row) + Math.abs(7 - cell.col));
          const score = attackScore * 1.0 + defendScore * 0.9 + centerBias;
          if (score > bestScore) {
            bestScore = score;
            bestMove = cell;
          }
        }

        return bestMove || empties[0] || { row: 0, col: 0 };
      },
      getEmptyCells(board) {
        const cells = [];
        for (let row = 0; row < BOARD_SIZE; row += 1) {
          for (let col = 0; col < BOARD_SIZE; col += 1) {
            if (board[row][col] === EMPTY) cells.push({ row, col });
          }
        }
        return cells;
      },
      getCandidateCells(board) {
        const candidates = [];
        for (let row = 0; row < BOARD_SIZE; row += 1) {
          for (let col = 0; col < BOARD_SIZE; col += 1) {
            if (board[row][col] !== EMPTY) continue;
            if (this.hasNeighbor(board, row, col, 2)) candidates.push({ row, col });
          }
        }
        return candidates;
      },
      hasNeighbor(board, row, col, dist) {
        for (let dr = -dist; dr <= dist; dr += 1) {
          for (let dc = -dist; dc <= dist; dc += 1) {
            if (dr === 0 && dc === 0) continue;
            const r = row + dr;
            const c = col + dc;
            if (r < 0 || r >= BOARD_SIZE || c < 0 || c >= BOARD_SIZE) continue;
            if (board[r][c] !== EMPTY) return true;
          }
        }
        return false;
      },
      evaluatePlacement(board, row, col, color) {
        board[row][col] = color;
        const dirs = [[1, 0], [0, 1], [1, 1], [1, -1]];
        let best = 0;
        for (const [dr, dc] of dirs) {
          const score = this.scoreLine(board, row, col, color, dr, dc);
          if (score > best) best = score;
        }
        board[row][col] = EMPTY;
        return best;
      },
      scoreLine(board, row, col, color, dr, dc) {
        let count = 1;
        let openEnds = 0;

        let r = row + dr;
        let c = col + dc;
        while (r >= 0 && r < BOARD_SIZE && c >= 0 && c < BOARD_SIZE && board[r][c] === color) {
          count += 1;
          r += dr;
          c += dc;
        }
        if (r >= 0 && r < BOARD_SIZE && c >= 0 && c < BOARD_SIZE && board[r][c] === EMPTY) openEnds += 1;

        r = row - dr;
        c = col - dc;
        while (r >= 0 && r < BOARD_SIZE && c >= 0 && c < BOARD_SIZE && board[r][c] === color) {
          count += 1;
          r -= dr;
          c -= dc;
        }
        if (r >= 0 && r < BOARD_SIZE && c >= 0 && c < BOARD_SIZE && board[r][c] === EMPTY) openEnds += 1;

        if (count >= 5) return 100000;
        if (count === 4 && openEnds === 2) return 10000;
        if (count === 4 && openEnds === 1) return 1000;
        if (count === 3 && openEnds === 2) return 800;
        if (count === 3 && openEnds === 1) return 80;
        if (count === 2 && openEnds === 2) return 50;
        if (count === 2 && openEnds === 1) return 10;
        return 2;
      }
    };

    const GameEngine = {
      state: null,
      timer: null,
      speedDelay: Number(speedSelect.value),
      startNewGame(autoRun = false) {
        this.stopTimer();
        const board = Array.from({ length: BOARD_SIZE }, () => Array(BOARD_SIZE).fill(EMPTY));
        const ai1Black = Math.random() < 0.5;
        this.state = {
          board,
          status: autoRun ? STATUS.RUNNING : STATUS.READY,
          currentColor: BLACK,
          blackAI: ai1Black ? "AI#1" : "AI#2",
          whiteAI: ai1Black ? "AI#2" : "AI#1",
          moveCount: 0,
          lastMove: null,
          moveHistory: []
        };
        this.renderAll();
        if (autoRun) this.scheduleNextStep();
      },
      getCurrentAIName() {
        return this.state.currentColor === BLACK ? this.state.blackAI : this.state.whiteAI;
      },
      stepLoop() {
        if (!this.state || this.state.status !== STATUS.RUNNING) return;

        const color = this.state.currentColor;
        const aiName = this.getCurrentAIName();
        this.updateStatus(`狀態：進行中（${aiName} 思考中）`);

        let move = AIEngine.getMove(this.state, color);
        if (!RuleEngine.validateMove(this.state.board, move.row, move.col)) {
          move = AIEngine.getEmptyCells(this.state.board)[0] || move;
        }
        if (!RuleEngine.validateMove(this.state.board, move.row, move.col)) {
          this.state.status = STATUS.ENDED;
          this.updateStatus("狀態：錯誤（無合法落子）");
          this.renderAll();
          return;
        }

        this.state.board[move.row][move.col] = color;
        this.state.moveCount += 1;
        const timestamp = Date.now();
        this.state.lastMove = { row: move.row, col: move.col, color };
        this.state.moveHistory.push({ row: move.row, col: move.col, color, aiName, tMs: timestamp });
        messageLogEl.textContent = `最近一步：${aiName} 落子 (${move.row}, ${move.col})`;

        if (RuleEngine.checkWin(this.state.board, move.row, move.col, color)) {
          this.state.status = STATUS.ENDED;
          const winner = color === BLACK ? "黑" : "白";
          this.updateStatus(`狀態：${winner}勝（${aiName}）`);
          this.renderAll();
          return;
        }

        if (RuleEngine.checkDraw(this.state.moveCount)) {
          this.state.status = STATUS.ENDED;
          this.updateStatus("狀態：平局");
          this.renderAll();
          return;
        }

        this.state.currentColor = color === BLACK ? WHITE : BLACK;
        this.renderAll();
        this.scheduleNextStep();
      },
      scheduleNextStep() {
        this.stopTimer();
        if (this.state?.status !== STATUS.RUNNING) return;
        this.timer = window.setTimeout(() => this.stepLoop(), this.speedDelay);
      },
      stopTimer() {
        if (this.timer) {
          window.clearTimeout(this.timer);
          this.timer = null;
        }
      },
      pauseOrResume() {
        if (!this.state) return;
        if (this.state.status === STATUS.RUNNING) {
          this.state.status = STATUS.PAUSED;
          this.stopTimer();
          this.renderAll();
          return;
        }
        if (this.state.status === STATUS.PAUSED) {
          this.state.status = STATUS.RUNNING;
          this.renderAll();
          this.scheduleNextStep();
        }
      },
      start() {
        if (!this.state || this.state.status === STATUS.ENDED) {
          this.startNewGame(true);
          return;
        }
        if (this.state.status === STATUS.READY) {
          this.state.status = STATUS.RUNNING;
          this.renderAll();
          this.scheduleNextStep();
        }
      },
      restart() {
        this.startNewGame(true);
      },
      setSpeed(delay) {
        this.speedDelay = delay;
        if (this.state?.status === STATUS.RUNNING) this.scheduleNextStep();
      },
      updateStatus(text) {
        statusTextEl.textContent = text;
      },
      renderAll() {
        if (!this.state) return;
        Renderer.drawBoard(this.state.board);
        Renderer.highlightLastMove(this.state.lastMove);

        drawResultEl.textContent = `本局抽籤結果：黑棋：${this.state.blackAI}（先手）｜白棋：${this.state.whiteAI}`;
        const colorText = this.state.currentColor === BLACK ? "黑" : "白";
        const currentAI = this.getCurrentAIName();
        turnTextEl.textContent = this.state.status === STATUS.ENDED
          ? "當前回合：-"
          : `當前回合：${colorText}（${currentAI}）`;
        moveTextEl.textContent = `步數：${this.state.moveCount}`;
        if (this.state.status === STATUS.READY) {
          this.updateStatus("狀態：READY");
        } else if (this.state.status === STATUS.PAUSED) {
          this.updateStatus("狀態：PAUSED");
        } else if (this.state.status === STATUS.RUNNING && !statusTextEl.textContent.startsWith("狀態：進行中（")) {
          this.updateStatus("狀態：RUNNING");
        }

        pauseBtn.disabled = this.state.status === STATUS.READY || this.state.status === STATUS.ENDED;
        pauseBtn.textContent = this.state.status === STATUS.PAUSED ? "繼續" : "暫停";
      }
    };

    startBtn.addEventListener("click", () => GameEngine.start());
    restartBtn.addEventListener("click", () => GameEngine.restart());
    pauseBtn.addEventListener("click", () => GameEngine.pauseOrResume());
    speedSelect.addEventListener("change", (event) => {
      GameEngine.setSpeed(Number(event.target.value));
    });

    GameEngine.startNewGame(false);
  </script>
</body>
</html>
